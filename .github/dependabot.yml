version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tokio:
        patterns:
          - "tokio*"
      tracing:
        patterns:
          - "tracing*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # `dtolnay/rust-toolchain` uses the git ref as the Rust toolchain
      # version, not as an action release. Dependabot can't distinguish
      # the two and will try to "upgrade" to Rust versions that don't
      # exist. We pin to MSRV in `rust-toolchain.toml` and update the
      # workflow refs manually when MSRV moves.
      - dependency-name: "dtolnay/rust-toolchain"
