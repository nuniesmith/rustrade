# Coverage-guided fuzzing for rustrade-backtest's CSV loader.
#
# Nightly-only: cargo-fuzz builds with libFuzzer + -Zsanitizer=address,
# which require a nightly toolchain. This crate is deliberately NOT part
# of the parent workspace (see the empty `[workspace]` table below and the
# `exclude = ["fuzz"]` in the root Cargo.toml), so stable CI never touches
# it. See README.md to run it.

[package]
name = "rustrade-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Detach from the parent workspace — fuzz builds use flags the stable
# workspace must never see.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rustrade-backtest = { path = "../crates/rustrade-backtest" }

[[bin]]
name = "load_csv"
path = "fuzz_targets/load_csv.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
